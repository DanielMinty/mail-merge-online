name: Build Windows download
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Build download
        shell: pwsh
        run: ./src/build_windows.ps1
      - name: Check archive size
        shell: pwsh
        run: |
          $archive = Get-Item Web-Mail-Merge-Windows-x64.zip
          if ($archive.Length -ge 100MB) { throw "Archive exceeds GitHub's 100 MB file limit" }
      - name: Upload download artifact
        uses: actions/upload-artifact@v4
        with:
          name: Web-Mail-Merge-Windows-x64
          path: Web-Mail-Merge-Windows-x64.zip
      - name: Put Windows download in repository root
        shell: pwsh
        run: |
          git config user.name 'DanielMinty'
          git config user.email '83800353+DanielMinty@users.noreply.github.com'
          git add -f Web-Mail-Merge-Windows-x64.zip
          git commit -m 'Add fresh Windows app download'
          git push origin HEAD:main
